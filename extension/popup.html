<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyntheticSilence2.0</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 400px; padding: 16px; margin: 0; }
    textarea { width: 100%; height: 100px; margin-bottom: 8px; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #results { margin-top: 16px; font-size: 14px; }
    .claim-card { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 4px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #e0e0e0; margin-bottom: 8px;}
    .badge.insufficient { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <h2>Analyze Claim</h2>
  <textarea id="inputText" placeholder="Paste text here to analyze for evidence insufficiency..."></textarea>
  <button id="analyzeBtn">Analyze with SyntheticSilence2.0</button>
  
  <div id="results"></div>

  <script src="dist/popup.js"></script>
</body>
</html>
